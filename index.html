<html>
<body>
<form onsubmit="handleSubmit(event)">
    So dau: <input type="text" id="a"><br><br>
    So cuoi: <input type="text" id="b"><br><br>
    <button type="submit">Tinh</button>
</form>
<p id="kq"></p>
<script>
function handleSubmit(event) {
    event.preventDefault();
    let a = Number(document.getElementById("a").value);
    let b = Number(document.getElementById("b").value);
    let tich = 1;
    let dem = 0;
    for (let i = a; i <= b; i++) {
        if (i % 7 == 0) {
            tich = tich * i;
            dem++;
        }
    }
    if (dem == 0) {
        document.getElementById("kq").innerHTML =
            "Khong co so chia het cho 7";
    } else {
        document.getElementById("kq").innerHTML = tich;
    }
}
</script>
</body>
</html>
